<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oznam - Odstávka webového sídla - Ústavný súd Slovenskej republiky</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary-blue: #002d62; /* Presná tmavomodrá Ústavného súdu */
            --text-dark: #272833;
            --text-muted: #a0aec0;
            --border-color: #e5e7eb;
            --font-base: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-serif: 'Times New Roman', Times, Georgia, serif;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Hlavný biely kontajner podľa predlohy */
        .card {
            background-color: var(--card-bg);
            max-width: 680px;
            width: 90%;
            padding: 3.5rem 3rem;
            box-sizing: border-box;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        /* Hlavička s logom */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 0.5rem;
        }

        .logo-text {
            text-align: left;
        }

        .logo-title {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 5px;
            color: #1a202c;
            line-height: 1.2;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            letter-spacing: 3.5px;
            color: #4a5568;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Deliace čiary */
        .divider {
            border: 0;
            height: 1px;
            background-color: #eaeaea;
            margin: 2.5rem 0;
        }

        /* Rotujúci loading kruh presne podľa obrázka */
        .spinner {
            width: 55px;
            height: 55px;
            border: 5px solid #eef2f6;
            border-top: 5px solid var(--primary-blue);
            border-radius: 50%;
            margin: 0 auto 2rem auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Typografia textu */
        h1 {
            font-size: 1.65rem;
            color: var(--primary-blue);
            margin: 0 0 2rem 0;
            font-weight: 700;
        }

        .message-body {
            font-size: 1.05rem;
            line-height: 1.75;
            color: #2d3748;
            margin: 0;
            padding: 0 1rem;
        }

        .message-body p {
            margin: 1.2rem 0;
        }

        .highlight {
            color: var(--primary-blue);
            font-weight: 700;
        }

            </style>
</head>
